name: Deploy to VPS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  quality-gate:
    name: Quality Gate (Compilation & Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Frontend Checks
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json
      - name: Install Frontend Deps
        run: npm ci
        working-directory: ./Frontend
      - name: Frontend Build check
        run: npm run build
        working-directory: ./Frontend

      # Backend Checks
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore Backend
        run: dotnet restore
        working-directory: ./Backend
      - name: Backend Build check
        run: dotnet build --no-restore
        working-directory: ./Backend
      - name: Restore Backend Tests
        run: dotnet restore
        working-directory: ./Backend.Tests
      - name: Run Backend Tests
        run: dotnet test --no-restore --verbosity normal
        working-directory: ./Backend.Tests

      # AI service syntax check (dependency installation belongs to the image build)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: AI syntax check
        run: python -m compileall -q .
        working-directory: ./MyIonio-AI

  build-backend:
    name: Build & Push Backend
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Image Name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$OWNER/myionio-backend" >> $GITHUB_ENV
        shell: bash

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  build-frontend:
    name: Build & Push Frontend
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Image Name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$OWNER/myionio-frontend" >> $GITHUB_ENV
        shell: bash

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          push: true
          build-args: |
            VITE_API_URL=https://api.myionio.site/api
            VITE_AI_URL=https://ai.myionio.site
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  build-ai:
    name: Build & Push AI Service
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set Image Name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$OWNER/myionio-ai" >> $GITHUB_ENV
        shell: bash
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push AI
        uses: docker/build-push-action@v5
        with:
          context: ./MyIonio-AI
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-ai]
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            cd ${{ secrets.SERVER_PATH }}

            # Production configuration is managed manually on the VPS.
            test -f .env || { echo "Missing production .env"; exit 1; }
            missing_config=false
            for name in DB_CONNECTION JWT_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
              if ! sudo grep -Eq "^${name}=.+$" .env; then
                echo "Missing required production variable: ${name}"
                missing_config=true
              fi
            done
            test "${missing_config}" = false

            for name in GEMINI_API_KEY SUPABASE_URL SUPABASE_KEY; do
              if ! sudo grep -Eq "^${name}=.+$" .env; then
                echo "Optional production variable is not configured: ${name}"
              fi
            done

            # Back up PostgreSQL before replacing containers or applying migrations.
            sudo docker compose up -d db
            sudo mkdir -p .deploy-backups
            backup_tmp=$(mktemp)
            sudo docker compose exec -T db pg_dump -U postgres -d postgres -Fc > "${backup_tmp}"
            sudo mv "${backup_tmp}" ".deploy-backups/postgres-$(date -u +%Y%m%dT%H%M%SZ).dump"

            # Update source code. The ignored production .env remains untouched.
            sudo git fetch origin master
            sudo git reset --hard origin/master

            # Pull the verified build output from GHCR and replace only application services.
            echo ${{ secrets.GITHUB_TOKEN }} | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo docker compose pull db backend frontend ai-service
            sudo docker compose up -d --remove-orphans db backend frontend ai-service
            sudo docker compose ps --status running db backend frontend ai-service

            # Check the services through their local published ports. Public DNS can
            # hairpin or be unavailable from the VPS even while a service is healthy.
            check_service() {
              name="$1"
              url="$2"
              container="$3"
              healthy=false
              for attempt in $(seq 1 30); do
                if curl --fail --silent --show-error --connect-timeout 3 --max-time 5 "${url}" > /dev/null; then
                  healthy=true
                  break
                fi
                sleep 5
              done

              if [ "${healthy}" != true ]; then
                echo "Local health check failed: ${name} (${url})"
                sudo docker compose ps
                sudo docker logs --tail 200 "${container}" || true
                exit 1
              fi
            }

            check_service frontend http://127.0.0.1:8080/health myionio-frontend
            check_service backend http://127.0.0.1:5000/api/health myionio-backend
            check_service ai-service http://127.0.0.1:8000/ myionio-ai

            sudo docker image prune -f

      - name: Verify public app routes
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --connect-timeout 5 --max-time 10 https://myionio.site/health
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --connect-timeout 5 --max-time 10 https://api.myionio.site/api/health
