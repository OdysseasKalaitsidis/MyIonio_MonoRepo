services:
  db:
    image: postgres:15
    container_name: myionio-db
    restart: always
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - myionio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: ghcr.io/odysseaskalaitsidis/myionio-backend:latest
    container_name: myionio-backend
    restart: always
    depends_on:
      db:
        condition: service_started
    environment:
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-MyIonio}
      - Jwt__Audience=${JWT_AUDIENCE:-MyIonioUsers}
      - Google__ClientId=${GOOGLE_CLIENT_ID}
      - Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - AllowedOrigins=${FRONTEND_URL:-https://myionio.site}
    networks:
      - myionio-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "5001:80"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5001/api}
        - VITE_AI_URL=${VITE_AI_URL:-http://localhost:8000}
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    image: ghcr.io/odysseaskalaitsidis/myionio-frontend:latest
    container_name: myionio-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - myionio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8080:80"

  ai-service:
    build:
      context: ./MyIonio-AI
      dockerfile: Dockerfile
    image: ghcr.io/odysseaskalaitsidis/myionio-ai:latest
    container_name: myionio-ai
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - BACKEND_URL=http://backend:80
      # Direct PostgreSQL connection (same cluster as C# backend)
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - AI_ALLOWED_ORIGINS=${AI_ALLOWED_ORIGINS:-https://myionio.site,http://localhost:5173,http://localhost:8080}
    networks:
      - myionio-network
    ports:
      - "127.0.0.1:8000:8000"

  prometheus:
    image: prom/prometheus:latest
    container_name: myionio-prometheus
    restart: always
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - myionio-network

  grafana:
    image: grafana/grafana:latest
    container_name: myionio-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-change-me-before-production}
    networks:
      - myionio-network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: myionio-alertmanager
    restart: always
    volumes:
      - ./infra/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    networks:
      - myionio-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: myionio-node-exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
    ports:
      - "9100:9100"
    networks:
      - myionio-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: myionio-cadvisor
    restart: always
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8082:8080"
    networks:
      - myionio-network

networks:
  myionio-network:
    driver: bridge

volumes:
  postgres_data:
