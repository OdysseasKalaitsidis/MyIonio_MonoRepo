<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MyIonio Local Admin</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#e8eefc;background:#07101f;color-scheme:dark}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#12366a 0,transparent 32%),#07101f}
    main{width:min(980px,calc(100% - 32px));margin:auto;padding:48px 0 80px} h1{font-size:clamp(30px,6vw,54px);margin:0 0 8px} p{color:#9fb0ca;line-height:1.6}
    .top{display:flex;gap:20px;justify-content:space-between;align-items:end;margin-bottom:32px}.badge{border:1px solid #315589;background:#11233f;padding:8px 12px;border-radius:999px;color:#9dc3ff;font-size:13px}
    .toolbar,.card{background:#0d192cdd;border:1px solid #213656;border-radius:20px;box-shadow:0 20px 60px #0005}.toolbar{padding:18px;display:flex;gap:12px;align-items:center;margin-bottom:20px}
    button{border:0;border-radius:12px;padding:11px 16px;font-weight:750;cursor:pointer;background:#2979ff;color:white}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#172943;color:#bed3f4}
    #status{font-size:14px;color:#a9bad3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{padding:20px}.semester{font-size:34px;font-weight:900;color:#82b3ff}.meta{display:grid;gap:7px;margin:16px 0 20px;font-size:14px;color:#afbed4}.hash{font-family:ui-monospace,monospace;font-size:11px;overflow-wrap:anywhere;color:#7186a6}
    .row{display:flex;justify-content:space-between;align-items:center;gap:12px}.ok{color:#6ee7a8}.new{color:#ffd37a}.error{color:#ff8c99}.empty{padding:42px;text-align:center;border:1px dashed #355078;border-radius:20px;color:#9fb0ca}
    @media(max-width:650px){.top{align-items:start;flex-direction:column}.toolbar{align-items:stretch;flex-direction:column}}
  </style>
</head>
<body>
<main>
  <div class="top"><div><h1>MyIonio Admin</h1><p>Επίσημα ωρολόγια προγράμματα → AI parser → βάση δεδομένων.</p></div><span class="badge">Local service · localhost:8000</span></div>
  <div class="toolbar"><button id="refresh">Έλεγχος επίσημης σελίδας</button><span id="status">Έτοιμο για έλεγχο.</span></div>
  <section id="documents" class="grid"></section>
</main>
<script>
  const documents = document.querySelector('#documents');
  const status = document.querySelector('#status');
  const refresh = document.querySelector('#refresh');
  const escapeHtml = value => String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const bytes = value => `${(value / 1024).toFixed(1)} KB`;

  async function load() {
    refresh.disabled = true; status.textContent = 'Έλεγχος και υπολογισμός SHA-256…'; documents.innerHTML = '';
    try {
      const response = await fetch('/pipeline/official/schedules');
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || 'Discovery failed');
      render(data.documents); status.textContent = `Βρέθηκαν ${data.documents.length} επίσημα PDF.`;
    } catch (error) {
      status.innerHTML = `<span class="error">${escapeHtml(error.message)}</span>`;
    } finally { refresh.disabled = false; }
  }

  function render(items) {
    if (!items.length) { documents.innerHTML = '<div class="empty">Δεν βρέθηκαν PDF.</div>'; return; }
    documents.innerHTML = items.map((item, index) => `
      <article class="card">
        <div class="row"><span class="semester">${escapeHtml(item.semester)}΄</span><span class="${item.already_imported ? 'ok' : 'new'}">${item.already_imported ? '✓ Εισαγμένο' : '● Νέο'}</span></div>
        <h2>${escapeHtml(item.academic_year)}</h2>
        <div class="meta"><span>${escapeHtml(item.document_type)}</span><span>${bytes(item.size_bytes)} · ${escapeHtml(item.published_date || 'χωρίς ημερομηνία')}</span><span class="hash">SHA-256 ${escapeHtml(item.sha256)}</span></div>
        <div class="row"><a href="${escapeHtml(item.url)}" target="_blank" rel="noreferrer" class="hash">PDF</a><button data-index="${index}" ${item.already_imported ? 'disabled' : ''}>${item.already_imported ? 'Ήδη εισαγμένο' : 'Parse & εισαγωγή'}</button></div>
      </article>`).join('');
    documents.querySelectorAll('button[data-index]').forEach(button => button.addEventListener('click', () => importDocument(items[Number(button.dataset.index)], button)));
  }

  async function importDocument(item, button) {
    button.disabled = true; button.textContent = 'Parsing…'; status.textContent = `${item.semester}΄ εξάμηνο: λήψη και AI parsing. Μπορεί να πάρει αρκετά λεπτά.`;
    try {
      const response = await fetch('/pipeline/official/import', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_url:item.url,expected_sha256:item.sha256})});
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || 'Import failed');
      status.innerHTML = `<span class="ok">Ολοκληρώθηκε: ${data.rows_written} εγγραφές για το ${escapeHtml(item.semester)}΄.</span>`;
      await load();
    } catch (error) {
      button.disabled = false; button.textContent = 'Δοκιμή ξανά'; status.innerHTML = `<span class="error">${escapeHtml(error.message)}</span>`;
    }
  }
  refresh.addEventListener('click', load); load();
</script>
</body>
</html>
