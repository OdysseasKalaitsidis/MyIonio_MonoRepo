server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; frame-src https://accounts.google.com; connect-src 'self' https://api.myionio.site https://ai.myionio.site https://accounts.google.com;" always;

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sw.js {
        try_files $uri =404;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # Proxy API requests to the backend if needed, 
    # but usually we handle this via environment variables in the frontend
    # and direct browser calls. If we want Nginx to proxy:
    # location /api {
    #     proxy_pass http://backend:80;
    # }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
    }
}
